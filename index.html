<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
          rel="stylesheet"
          type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <div class="header">
      <img src="./eisenhower-matrix.jpg" class="header-img">
      <a class="more"
         href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>

    <div class="main">
      <section id="add-item">
        <h3 class="title add-item-title">Add Item</h3>
        <div class="wrapper">
          <input id="new-task"class="task new-task text" type="text">
          <button class="button">Add</button>
        </div>
      </section>

      <section>
        <h3 class="title">Todo</h3>
        <ul id="todo" class="list">
          <li class="list-item">
            <input type="checkbox" class="checkbox">
            <label class="task list-title">Pay Bills</label>
            <input type="text" class="task text">
            <button class="edit button">Edit</button>
            <button class="delete button">
              <img src="./remove.svg" class="delete-img">
            </button>
          </li>
          <li class="edit-mode list-item">
            <input type="checkbox" class="checkbox">
            <label class="task list-title">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task text">
            <button class="edit button">Save</button>
            <button class="delete button">
              <img src="./remove.svg" class="delete-img">
            </button>
          </li>
        </ul>
      </section>

      <section>
        <h3 class="title">Completed</h3>
        <ul id="completed"  class="list completed">
          <li class="list-item">
            <input type="checkbox" class="checkbox" checked>
            <label class="task list-title">See the Doctor</label>
            <input type="text" class="task text">
            <button class="edit button">Edit</button>
            <button class="delete button">
              <img src="./remove.svg" class="delete-img">
            </button>
          </li>
        </ul>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
