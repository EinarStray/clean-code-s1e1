<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
          rel="stylesheet"
          type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <div class="header">
      <img src="./eisenhower-matrix.jpg" class="header__img" alt="Eisenhower Matrix">
      <a class="header__more"
         href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>

    <div class="main">
      <section id="add-item" class="add-item">
        <h3 class="title add-item__title">Add Item</h3>
        <div class="add-item__wrapper">
          <input id="add-item__new-task" class="task add-item__new-task text" type="text">
          <button class="button add-item__button" id="add-item__button">Add</button>
        </div>
      </section>

      <section class="todo">
        <h3 class="title todo__title">Todo</h3>
        <ul id="todo" class="list todo__list">
          <li class="list-item todo__item todo-item">
            <input type="checkbox" class="checkbox todo-item__checkbox">
            <label class="task list-title todo-item__title">Pay Bills</label>
            <input type="text" class="task text todo-item__input">
            <button class="button-edit button todo-item__edit-button">Edit</button>
            <button class="button-delete button todo-item__delete-button">
              <img src="./remove.svg" class="button-delete__delete-img" alt="Delete task">
            </button>
          </li>
          <li class="edit-mode list-item todo__item">
            <input type="checkbox" class="checkbox todo-item__checkbox">
            <label class="task list-title todo-item__title">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task text todo-item__input">
            <button class="button-edit button todo-item__edit-button">Save</button>
            <button class="button-delete button todo-item__delete-button">
              <img src="./remove.svg" class="button-delete__delete-img" alt="Delete task">
            </button>
          </li>
        </ul>
      </section>

      <section class="completed">
        <h3 class="title completed__title">Completed</h3>
        <ul id="completed"  class="list completed__list">
          <li class="list-item completed__item completed-item">
            <input type="checkbox" class="checkbox completed-item__checkbox" checked>
            <label class="task list-title completed-item__title">See the Doctor</label>
            <input type="text" class="task text completed-item__input">
            <button class="button-edit button completed-item__edit-button">Edit</button>
            <button class="button-delete button completed-item__delete-button">
              <img src="./remove.svg" class="button-delete__delete-img" alt="Delete task">
            </button>
          </li>
        </ul>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
